
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English AI</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1020;
color:white;
padding:20px;
}

.container{max-width:500px;margin:auto}

header{text-align:center;padding:25px 0}

h1{color:#65a5ff;font-size:32px}

.card{
background:#17223b;
padding:20px;
border-radius:18px;
margin-bottom:18px;
}

button{
border:0;
border-radius:12px;
padding:14px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:disabled{opacity:.5}

.primary{
background:#397cff;
color:white;
width:100%;
}

.secondary{
background:#263958;
color:white;
width:100%;
margin-top:10px;
}

textarea,input{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #52617d;
background:#0b1428;
color:white;
font-size:16px;
margin:10px 0;
}

textarea{min-height:100px}

#result,#translated{
white-space:pre-wrap;
line-height:1.6;
}

.small{color:#aab6d3;font-size:14px}
</style>
</head>

<body>
<div class="container">

<header>
<h1>English AI</h1>
<p>Seu professor particular de inglês com IA</p>
</header>

<div class="card">
<h3>🎙️ Conversação</h3>
<p class="small">Pratique inglês falando naturalmente.</p>

<button class="primary" id="startBtn" onclick="startVoice()">
Começar a falar
</button>

<button class="secondary" onclick="stopVoice()">
Parar conversa
</button>

<p id="voiceStatus" class="small">
Aguardando você começar...
</p>
</div>

<div class="card">
<h3>💬 Conversar com o professor</h3>

<textarea id="message"
placeholder="Escreva sua frase em inglês..."></textarea>

<button class="primary" id="sendBtn" onclick="sendMessage()">
Enviar mensagem
</button>

<div id="result"></div>
</div>

<div class="card">
<h3>🌎 Tradutor</h3>

<input id="translation"
placeholder="Digite uma frase para traduzir">

<button class="primary" onclick="translateText()">
Traduzir
</button>

<p id="translated"></p>
</div>

</div>

<script>

// COLOQUE AQUI O ENDEREÇO DO SEU WORKER
const API_URL = "https://COLOQUE-AQUI-SEU-WORKER.workers.dev";

let recognition = null;
let listening = false;
let sending = false;
let history = [];

function speak(text){
if(!window.speechSynthesis)return;

speechSynthesis.cancel();

const utterance = new SpeechSynthesisUtterance(text);
utterance.lang = "en-US";
utterance.rate = 0.9;

speechSynthesis.speak(utterance);
}

async function startVoice(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){
document.getElementById("voiceStatus").innerText =
"Seu navegador não oferece reconhecimento de voz. Tente usar o Chrome.";
return;
}

if(listening)return;

recognition = new SpeechRecognition();
recognition.lang = "en-US";
recognition.continuous = true;
recognition.interimResults = false;

recognition.onresult = async function(event){

const index = event.results.length - 1;

if(!event.results[index].isFinal)return;

const text = event.results[index][0].transcript;

document.getElementById("message").value = text;

await sendMessage();
};

recognition.onerror = function(event){

document.getElementById("voiceStatus").innerText =
"Problema no microfone: " + event.error;

if(event.error === "not-allowed"){
listening = false;
}
};

recognition.onend = function(){

if(listening){
setTimeout(()=>{
if(listening){
try{recognition.start()}catch(e){}
}
},500);
}
};

try{
listening = true;
recognition.start();

document.getElementById("voiceStatus").innerText =
"Ouvindo você... Fale em inglês.";

}catch(error){
listening = false;
document.getElementById("voiceStatus").innerText =
"Não foi possível iniciar o microfone.";
}
}

function stopVoice(){

listening = false;

if(recognition){
recognition.stop();
recognition = null;
}

if(window.speechSynthesis){
speechSynthesis.cancel();
}

document.getElementById("voiceStatus").innerText =
"Conversa pausada.";
}

async function apiRequest(path,data){

const response = await fetch(API_URL + path,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(data)
});

const result = await response.json();

if(!response.ok){
throw new Error(result.error || "Erro no servidor.");
}

return result;
}

async function sendMessage(){

const message =
document.getElementById("message").value.trim();

if(!message || sending)return;

const result = document.getElementById("result");
const button = document.getElementById("sendBtn");

sending = true;
button.disabled = true;

result.innerText = "Seu professor está pensando...";

try{

const data = await apiRequest("/api/chat",{
message:message,
history:history
});

if(!data.reply){
throw new Error("O professor não retornou uma resposta.");
}

result.innerText = data.reply;

history.push(
{role:"user",content:message},
{role:"assistant",content:data.reply}
);

history = history.slice(-20);

speak(data.reply);

document.getElementById("message").value = "";

}catch(error){

result.innerText =
"Não foi possível conectar ao professor. Verifique a conexão e tente novamente.\n\n" +
error.message;

}finally{

sending = false;
button.disabled = false;

}
}

async function translateText(){

const text =
document.getElementById("translation").value.trim();

const output = document.getElementById("translated");

if(!text)return;

output.innerText = "Traduzindo...";

try{

const data = await apiRequest("/api/translate",{
text:text
});

output.innerText = data.translation;

}catch(error){

output.innerText =
"Não foi possível traduzir. Verifique a conexão e tente novamente.";

}
}

</script>
</body>
  </html>
